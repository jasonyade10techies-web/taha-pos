name: Hostinger compiled ZIP acceptance
on:
  push:
    branches: [codex/cloud-native-release]
    paths: ['scripts/**', 'server/**', 'src/**', 'distribution/**', 'package*.json', '.github/workflows/hostinger-zip.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hostinger-zip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: taha_phase5c
          POSTGRES_HOST_AUTH_METHOD: trust
          PGDATA: /var/lib/postgresql/data/.test-postgres/phase5c-20261014/pgdata
        ports: ['127.0.0.1:55459:5432']
        options: >-
          --health-cmd "pg_isready -U taha_phase5c -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TZ: Asia/Karachi
      TAHA_TEST_POSTGRES_URL: postgresql://taha_phase5c@127.0.0.1:55459/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: npm ci --include=dev && npm ci --prefix server --include=dev
      - run: python -m pip install pypdf==6.21.4 cryptography==50.0.2
      - name: Matching PostgreSQL client for disposable backup/restore
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          test "$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '$1=="fpr" {print $10;exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/taha-pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo 'TAHA_TEST_POSTGRES_BIN=/usr/lib/postgresql/17/bin' >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release-system
      - run: node scripts/package-r2b.mjs --phase R3A --version 0.5.0-r3a.8
      - name: Production-only install, build verifier, real API and fresh shop
        run: npm run ci:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hostinger-zip-acceptance
          path: |
            artifacts/managed/*.zip
            artifacts/managed/*.zip.json
            .test-postgres/r2c-20261113/*/results.json
            .test-postgres/r2c-20261113/*/failure.json
            .test-postgres/r2c-20261113/*/setup-readback-fixture.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
