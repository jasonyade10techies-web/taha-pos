name: Windows native staging build
on:
  push:
    branches: [codex/cloud-native-release]
    paths: ['src-tauri/**', 'src/**', 'scripts/build-desktop.mjs', '.github/workflows/windows-build.yml']
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'scripts/build-desktop.mjs'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      # Observed selected hPanel staging domain. API reachability is a separate gate.
      TAHA_API_URL: https://maroon-louse-575853.hostingersite.com
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-msvc-rust199-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-msvc-rust199-
      - name: Verify Windows compiler and SDK
        shell: pwsh
        run: |
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $compiler=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\cl.exe'
          if(-not $compiler){throw 'Required MSVC x64 compiler unavailable'}
          if(-not (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include')){throw 'Windows SDK unavailable'}
          Write-Output 'MSVC x64 and Windows SDK verified on the build runner.'
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          if($LASTEXITCODE -ne 0){throw 'Pinned Rust installation failed'}
          rustup default 1.99.0
          rustc --version
          cargo --version
      - run: npm ci; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}; npm ci --prefix server
      - name: Remove only regenerated installer output restored from build cache
        shell: pwsh
        run: |
          $workspace=(Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          $bundles=Join-Path $workspace 'src-tauri/target/release/bundle'
          if(Test-Path -LiteralPath $bundles){
            $resolved=(Resolve-Path -LiteralPath $bundles).Path
            if(-not $resolved.StartsWith($workspace+[IO.Path]::DirectorySeparatorChar,[StringComparison]::OrdinalIgnoreCase)){throw 'Unsafe generated-output path'}
            Remove-Item -LiteralPath $resolved -Recurse -Force
          }
      - name: Validate and compile native application
        run: |
          npm run typecheck
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          npm run validate:tauri
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          npm run tauri -- build --ci --config src-tauri/tauri.staging.conf.json --bundles nsis,msi -- --locked
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Inspect installer provenance
        run: |
          $installers=Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object Extension -in '.exe','.msi'
          $version=(Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if($installers.Count -ne 2 -or ($installers | Where-Object Name -notlike "*_${version}_*")){throw 'Exactly the current NSIS and MSI installers are required'}
          $installers | ForEach-Object { [pscustomobject]@{file=$_.Name;size=$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash;authenticode=(Get-AuthenticodeSignature -LiteralPath $_.FullName).Status.ToString()} } | ConvertTo-Json | Set-Content windows-build-evidence.json
          Get-Content windows-build-evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-native-staging-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/taha-pos.exe
            windows-build-evidence.json
            dist-desktop/deployment.json
          retention-days: 14
          if-no-files-found: error
      # These are validation artifacts, not a published/signed updater release.
